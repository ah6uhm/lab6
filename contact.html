<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | CCT360 Lab 6</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand fs-lg" href="index.html">
                <img src="images/logo.png" alt="Club crest logo" height="48" class="d-inline-block align-middle me-2">
                Real Madrid Unofficial Store
            </a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <p class="drawer-title h5" id="navbarNavLabel">Menu</p>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link fs-lg" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-lg" href="#">Shop</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-lg active" href="contact.html" aria-current="page">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

    <main>

    <div class="container mt-5">
        <h1>Contact Us</h1>

        <form style="max-width:950px; margin:0px auto">
            <div class="row g-4">
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="firstName" class="form-label">First name</label>
                        <input type="text" class="form-control" id="firstName" name="firstName">
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="lastName" class="form-label">Last name</label>
                        <input type="text" class="form-control" id="lastName" name="lastName">
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com">
                    </div>
                </div>
                <div class="md:col-6">
                    <div class="form-field">
                        <label for="topic" class="form-label">What is your question about?</label>
                        <select class="form-control" id="topic" name="topic">
                            <option>Order status</option>
                            <option>Sizing help</option>
                            <option>Returns</option>
                            <option>Team bulk order</option>
                        </select>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-field">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-field">
                        <input type="checkbox" id="consent" class="check">
                        <label for="consent">I agree to be contacted about my question.</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-solid theme-primary mt-5">Send message</button>
        </form>
    </div>

    </main>

    <footer class="mt-auto">
        <div class="p-3 bg-primary fg-contrast-primary text-center"><p class="mb-0">&copy; CCT360 Lab 6</p></div>
    </footer>

</body>
</html>
