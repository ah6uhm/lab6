<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCT360 Lab 6</title>
    <link rel="stylesheet" href="css/bootstrap.min.css"/>
    <link rel="stylesheet" href="css/style.css"/>
    <script type="module" src="js/bootstrap.bundle.min.js"></script>
</head>
<body>

    <nav class="navbar md:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand fs-4" href="index.html">
                <img src="images/logo.png" alt="Club crest logo" height="48" class="d-inline-block align-middle me-2">
                Real Madrid Unofficial Store
            </a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNav" aria-labelledby="navbarNavLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link fs-5 active" href="index.html" aria-current="page">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="#">Shop</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link fs-5" href="contact.html">Contact</a>
                        </li>
                    </ul>
                </div>
            </dialog>
        </div>
    </nav>

        <div class="container mt-5">
        <div id="heroCarousel" class="carousel carousel-overlay slide">
            <div class="carousel-inner rounded-top-5">
                <div class="carousel-item active">
                    <img src="images/banner-kits.jpg" class="d-block w-100" alt="New season football kits on display in a shop">
                </div>
                <div class="carousel-item">
                    <img src="images/banner-matchday.jpg" class="d-block w-100" alt="Fans in scarves cheering in a stadium on matchday">
                </div>
                <div class="carousel-item">
                    <img src="images/banner-3.jpg" class="d-block w-100" alt="Football player in action during a match">
                </div>
            </div>
            <div class="carousel-overlay-controls">
                <div>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                        <span class="carousel-icon-prev" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="btn-icon btn-sm btn-subtle theme-secondary" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                        <span class="carousel-icon-next" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
                </div>
            </div>
        </div>

        <div class="bg-primary fg-contrast-primary p-5 rounded-bottom-5">
            <h1>The unofficial Real Madrid store.</h1>
            <p>Kits, boots and match-day essentials for supporters of every level.</p>
            <a class="btn-solid theme-primary" href="#shop">Shop the collection</a>
        </div>
    </div>

    <footer class="container-fluid mt-5">
        <p class="p-3 bg-primary fg-contrast-primary text-center">&copy; CCT360 Lab 6</p>
    </footer>

</body>
</html>
